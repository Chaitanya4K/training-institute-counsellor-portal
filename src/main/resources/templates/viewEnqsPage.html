<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Enquiries</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: rgb(0, 128, 255);
}

.sidebar {
	min-height: 100vh;
	background-color: #1e293b;
}

.sidebar a {
	color: #cbd5e1;
	display: block;
	padding: 12px;
	text-decoration: none;
}

.sidebar a:hover {
	background-color: #334155;
	color: white;
}

.topbar {
	background: rgb(28, 255, 128);
	padding: 10px;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.card {
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
	border: none;
}
</style>
</head>

<body>

	<div class="container-fluid">
		<div class="row">

			<!-- Sidebar -->
			<div class="col-md-2 sidebar text-white">
				<h4 class="p-3">Portal</h4>
				<a th:href="@{/dashboard}">Dashboard</a> <a th:href="@{/enquiry}">Add
					Enquiry</a> <a th:href="@{/view-enquiries}">View Enquiries</a> <a
					th:href="@{/logout}" class="text-danger">Logout</a>
			</div>

			<!-- Main Content -->
			<div class="col-md-10 p-4">

				<div class="topbar mb-4">
					<h5>View Enquiries</h5>
				</div>

				<!-- FILTER CARD -->
				<div class="card p-3 mb-4">

					<form th:action="@{/filter-enqs}"
						th:object="${viewEnqsFilterRequest}" method="post">

						<div class="row">

							<div class="col-md-3">
								<select class="form-control" th:field="*{classMode}">
									<option value="">Class Mode</option>
									<option value="Online">Online</option>
									<option value="Classroom">Classroom</option>
								</select>
							</div>

							<div class="col-md-3">
								<select class="form-control" th:field="*{courseName}">
									<option value="">Course</option>
									<option value="Java">Java</option>
									<option value="Python">Python</option>
									<option value="DevOps">DevOps</option>
									<option value="AWS">AWS</option>
									<option value="Generic AI">Generic AI</option>
								</select>
							</div>

							<div class="col-md-3">
								<select class="form-control" th:field="*{status}">
									<option value="">Status</option>
									<option value="Open">Open</option>
									<option value="Enrolled">Enrolled</option>
									<option value="Lost">Lost</option>
								</select>
							</div>

							<div class="col-md-3">
								<button class="btn btn-success w-100">Search</button>
							</div>

						</div>

					</form>

				</div>

				<!-- TABLE -->
				<div class="card p-3">

					<table class="table table-hover">

						<thead class="table-light">
							<tr>
								<th>#</th>
								<th>Name</th>
								<th>Course</th>
								<th>Mode</th>
								<th>Status</th>
								<th>Action</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="enq, i : ${enquiries}">
								<td th:text="${i.index+1}"></td>
								<td th:text="${enq.studentName}"></td>
								<td th:text="${enq.courseName}"></td>
								<td th:text="${enq.classMode}"></td>

								<td><span class="badge bg-success"
									th:if="${enq.status=='Enrolled'}">Enrolled</span> <span
									class="badge bg-warning" th:if="${enq.status=='Open'}">Open</span>
									<span class="badge bg-danger" th:if="${enq.status=='Lost'}">Lost</span>
								</td>

								<td><a class="btn btn-sm btn-primary"
									th:href="@{/editEnq(enquiryId=${enq.enquiryId})}">
									Edit</a> 
									<a class="btn btn-sm btn-danger"
									th:href="@{/deleteEnq(enquiryId=${enq.enquiryId})}"
									onclick="return confirm('Are you sure you want to delete this enquiry?')">
									Delete</a>
								</td>

							</tr>
							<tr th:if="${enquiries.size()==0}">
								<td colspan="7">No Records Found</td>
							</tr>
						</tbody>

					</table>

				</div>

			</div>
		</div>
	</div>

</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: linear-gradient(135deg, #1e293b, #3b82f6);
}

.card {
	border-radius: 12px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
</style>
</head>

<body>

	<div class="d-flex justify-content-center align-items-center vh-100">

		<div class="card p-4" style="width: 400px;">

			<h4 class="text-center mb-3">Register</h4>

			<div th:if="${emsg}" class="alert alert-danger">
				<p th:text="${emsg}"></p>
			</div>

			<div th:if="${smsg}" class="alert alert-success">
				<p th:text="${smsg}"></p>
			</div>

			<form th:action="@{/register}" th:object="${counsellor}"
				method="post">

				<input type="text" th:field="*{name}" class="form-control mb-3"
					placeholder="Full Name" required> <input type="email"
					th:field="*{email}" class="form-control mb-3" placeholder="Email"
					required> <input type="number" th:field="*{phno}"
					class="form-control mb-3" placeholder="Phone Number" required>

				<input type="password" th:field="*{password}"
					class="form-control mb-3" placeholder="Password" required>

				<button class="btn btn-primary w-100">Register</button>

			</form>

			<div class="text-center mt-3">
				<a th:href="@{/}">Already have an account? Login</a>
			</div>

		</div>

	</div>

</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: linear-gradient(135deg, #1e293b, #3b82f6);
}

.card {
	border-radius: 12px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
</style>
</head>

<body>

	<div class="d-flex justify-content-center align-items-center vh-100">

		<div class="card p-4" style="width: 350px;">

			<h4 class="text-center mb-3">Login</h4>

			<div th:if="${emsg}" class="alert alert-danger text-center">
				<p th:text="${emsg}"></p>
			</div>

			<form th:action="@{/login}" th:object="${counsellor}" method="post">

				<input type="email" th:field="*{email}" class="form-control mb-3"
					placeholder="Enter Email" required> <input type="password"
					th:field="*{password}" class="form-control mb-3"
					placeholder="Enter Password" required>

				<button class="btn btn-primary w-100">Login</button>

			</form>

			<div class="text-center mt-3">
				<a th:href="@{/register}">Create Account</a>
			</div>

		</div>

	</div>

</body>
</html>
